<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lydarr</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d1a;
    --surface: #141428;
    --surface2: #1a1a35;
    --border: #2a2a4a;
    --text: #d0d0e8;
    --text-muted: #6b6b8a;
    --accent: #7c6af7;
    --accent-hover: #9485ff;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #3b82f6;
    --slate: #64748b;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  header h1 {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot.red   { background: var(--red);   box-shadow: 0 0 6px var(--red); }
  .dot.grey  { background: var(--slate); }

  .label-muted { color: var(--text-muted); font-size: 12px; }

  header .spacer { flex: 1; }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    margin-left: auto;
  }

  /* ── Buttons ── */
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 5px 14px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button.secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: var(--border); }
  button.danger { background: var(--red); }
  button.danger:hover { background: #dc2626; }
  button.success { background: var(--green); }
  button.success:hover { background: #16a34a; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  /* ── Main layout ── */
  main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .panel {
    padding: 18px;
    overflow-y: auto;
    min-width: 150px;
  }

  .panel-resize-handle {
    width: 5px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .panel-resize-handle:hover, .panel-resize-handle.resizing { background: var(--accent); }

  @media (max-width: 850px) {
    main { flex-direction: column; overflow-x: hidden; overflow-y: auto; }
    .panel { flex: none !important; width: 100%; min-width: 0; min-height: 280px; }
    .panel-resize-handle { width: 100%; height: 5px; cursor: row-resize; }
  }

  .panel h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }

  /* ── Form controls ── */
  .row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }

  input[type="text"], input[type="number"], select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 5px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 13px;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  input[type="text"].grow { flex: 1; min-width: 0; }
  input[type="number"] { width: 70px; }

  .search-wrap { position: relative; flex: 1; min-width: 0; }
  .search-wrap > input[type="text"] { width: 100%; padding-right: 26px; }
  button.clear-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; padding: 0 3px; cursor: pointer;
    font-size: 14px; color: var(--text-muted); line-height: 1; display: none;
  }
  button.clear-btn:hover { background: none; color: var(--text); }
  .search-wrap > input:not(:placeholder-shown) ~ button.clear-btn { display: block; }

  .filters { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  label { display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 13px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }

  /* ── Results ── */
  .results { margin-top: 10px; }

  .empty-msg { color: var(--text-muted); font-size: 13px; padding: 12px 0; }

  /* Anime result card */
  .anime-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .anime-card-img {
    width: 42px;
    height: 60px;
    object-fit: cover;
    border-radius: 4px;
    flex-shrink: 0;
    background: var(--surface2);
  }
  .anime-card .info { flex: 1; min-width: 0; }
  .anime-card .title {
    font-weight: 500;
    margin-bottom: 3px;
    word-break: break-word;
  }
  .anime-card .meta { font-size: 12px; color: var(--text-muted); display: flex; gap: 8px; flex-wrap: wrap; }

  /* Badge */
  .badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .badge.ongoing  { background: #14532d; color: var(--green); }
  .badge.upcoming { background: #1e3a5f; color: var(--blue); }
  .badge.finished { background: #1e1e2e; color: var(--slate); }
  .badge.delayed  { background: #431407; color: var(--yellow); }
  .badge.unknown  { background: #1e1e2e; color: var(--text-muted); }
  .badge.trusted  { background: #14532d; color: var(--green); }
  .badge.normal   { background: #1e1e2e; color: var(--slate); }
  .badge.remake   { background: #450a0a; color: var(--red); }

  .track-btn { flex-shrink: 0; }
  .inline-msg { font-size: 11px; margin-top: 3px; }
  .inline-msg.ok  { color: var(--green); }
  .inline-msg.err { color: var(--red); }

  /* Torrent table */
  .torrent-table {
    width: 100%;
    min-width: 500px;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 12px;
    margin-top: 4px;
  }
  .torrent-table th {
    position: relative;
    text-align: left;
    color: var(--text-muted);
    padding: 4px 6px;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    user-select: none;
    overflow: hidden;
  }
  .torrent-table th.sortable { cursor: pointer; }
  .torrent-table th.sortable:hover { color: var(--text); }
  .sort-arrow { margin-left: 3px; font-size: 10px; opacity: 0.6; }
  .torrent-table td {
    padding: 6px 6px;
    border-bottom: 1px solid #1a1a2e;
    vertical-align: middle;
  }
  .torrent-table tr:hover td { background: var(--surface2); }
  .torrent-table .name-cell {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .col-resize-handle {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 5px;
    cursor: col-resize;
    z-index: 1;
  }
  .col-resize-handle:hover, .col-resize-handle.resizing { background: var(--accent); opacity: 0.7; }
  .torrent-table .seeders { color: var(--green); font-weight: 500; }
  .torrent-table .leechers { color: var(--red); }

  a.magnet-link { color: var(--accent); text-decoration: none; font-size: 11px; }
  a.magnet-link:hover { color: var(--accent-hover); }

  .add-btn {
    padding: 3px 8px;
    font-size: 11px;
  }

  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-banner {
    background: #450a0a;
    border: 1px solid var(--red);
    color: var(--red);
    padding: 8px 12px;
    border-radius: 5px;
    margin-bottom: 10px;
    font-size: 13px;
  }


  .wl-title-btn {
    background: none; border: none; padding: 0;
    color: var(--accent); cursor: pointer; font-size: 13px; font-weight: 500;
    text-align: left; font-family: inherit;
  }
  .wl-title-btn:hover { color: var(--accent-hover); text-decoration: underline; }
  .sub-tag {
    display: inline-block; padding: 1px 6px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 3px; font-size: 11px;
    color: var(--text-muted); margin-right: 3px;
  }
  .wl-subs { margin-top: 3px; display: flex; align-items: center; flex-wrap: wrap; gap: 3px; }
  .wl-edit-row { margin-top: 6px; display: flex; gap: 6px; align-items: center; }
  .wl-edit-row input { flex: 1; min-width: 0; font-size: 12px; }

  .type-toggle { display: flex; gap: 0; margin-bottom: 12px; }
  .type-toggle button {
    border-radius: 0; flex: 1; background: var(--surface2);
    color: var(--text-muted); border: 1px solid var(--border);
  }
  .type-toggle button:first-child { border-radius: 5px 0 0 5px; }
  .type-toggle button:last-child  { border-radius: 0 5px 5px 0; border-left: none; }
  .type-toggle button.active { background: var(--accent); color: #fff; }
  .badge.anime-badge { background: #1e1b4b; color: #818cf8; }
  .badge.manga-badge { background: #431407; color: #fb923c; }

  /* ── Watchlist ── */
  .watchlist-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    border-right: 1px solid var(--border);
  }
  .watchlist-item:last-child { border-bottom: none; }
  .watchlist-item .wl-title { flex: 1; font-size: 13px; }
  .watchlist-item .remove-btn { padding: 3px 10px; font-size: 12px; }
  .watchlist-item.deprecated .info { opacity: 0.45; }
  .watchlist-item.deprecated .wl-title-text { font-size: 13px; font-weight: 500; }
  .section-sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  /* ── Panel tabs ── */
  .tabs {
    display: flex;
    align-items: center;
    gap: 2px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .tabs .tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 4px 10px 6px;
  }
  .tabs .tab:hover { background: none; color: var(--text); }
  .tabs .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── Calendar ── */
  .cal-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .cal-toolbar button { padding: 3px 10px; font-size: 12px; }
  .cal-nav { display: flex; gap: 4px; }
  .cal-title { font-weight: 600; font-size: 13px; flex: 1; min-width: 100px; }
  .cal-view-toggle { margin-bottom: 0; }
  .cal-view-toggle button { flex: none; }

  .cal-month {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .cal-dow {
    background: var(--surface);
    color: var(--text-muted);
    font-size: 10px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-align: center;
    padding: 4px 0;
  }
  .cal-day { background: var(--bg); min-height: 76px; padding: 3px 4px; min-width: 0; }
  .cal-day.other { background: #0a0a14; }
  .cal-day.other .cal-daynum { opacity: 0.4; }
  .cal-day.today { background: var(--surface); box-shadow: inset 0 0 0 1px var(--accent); }
  .cal-daynum { font-size: 11px; color: var(--text-muted); margin-bottom: 2px; }
  .cal-day.today .cal-daynum { color: var(--accent); font-weight: 700; }

  .cal-chip {
    display: flex;
    align-items: baseline;
    gap: 4px;
    width: 100%;
    padding: 1px 4px;
    margin-bottom: 2px;
    border: none;
    border-left: 3px solid var(--accent);
    border-radius: 3px;
    color: var(--text);
    font-size: 11px;
    text-align: left;
    overflow: hidden;
  }
  .cal-chip:hover { filter: brightness(1.45); }
  .cal-chip .t { color: var(--text-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .cal-chip .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-more {
    background: none; border: none; padding: 0 3px;
    color: var(--text-muted); font-size: 10px; border-radius: 3px;
  }
  .cal-more:hover { background: var(--surface2); color: var(--text); }

  .cal-week { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .cal-week-scroll { overflow-x: auto; }
  .cal-week-inner { min-width: 520px; }
  .cal-week-head {
    display: grid;
    grid-template-columns: 42px repeat(7, minmax(0, 1fr));
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .cal-week-head div { text-align: center; padding: 4px 2px; font-size: 11px; color: var(--text-muted); }
  .cal-week-head .dnum { display: block; font-size: 14px; font-weight: 600; color: var(--text); }
  .cal-week-head .is-today .dnum { color: var(--accent); }
  .cal-grid-scroll { max-height: 58vh; overflow-y: auto; }
  .cal-grid { display: grid; grid-template-columns: 42px repeat(7, minmax(0, 1fr)); }
  .cal-gutter-hour {
    height: 44px;
    font-size: 10px;
    color: var(--text-muted);
    text-align: right;
    padding-right: 5px;
    transform: translateY(-6px);
  }
  .cal-col {
    position: relative;
    border-left: 1px solid #1a1a2e;
    background-image: repeating-linear-gradient(
      to bottom, transparent 0, transparent 43px, #1a1a2e 43px, #1a1a2e 44px);
  }
  .cal-col.today-col { background-color: rgba(124, 106, 247, 0.05); }
  .cal-event {
    position: absolute;
    display: flex;
    flex-direction: column;
    padding: 1px 4px;
    border: none;
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    color: var(--text);
    font-size: 10px;
    line-height: 1.25;
    text-align: left;
    overflow: hidden;
  }
  /* Anything under ~40 min is too short to stack time above title. */
  .cal-event.short { flex-direction: row; align-items: baseline; gap: 4px; }
  .cal-event:hover { filter: brightness(1.45); z-index: 4; }
  .cal-event .ev-t { color: var(--text-muted); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .cal-event .ev-n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cal-event:not(.short) .ev-n { white-space: normal; }
  .cal-now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--red); z-index: 5; pointer-events: none; }
  .cal-now::before {
    content: ''; position: absolute; left: -4px; top: -5px;
    width: 8px; height: 8px; border-radius: 50%; background: var(--red);
  }

  .cal-legend { display: flex; flex-wrap: wrap; gap: 3px 6px; margin-top: 10px; }
  .cal-legend span {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--text-muted);
    transition: background 0.12s, color 0.12s;
  }
  .cal-legend span.hl { background: var(--surface2); color: var(--text); }
  .cal-legend i { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; transition: transform 0.12s; }
  .cal-legend span.hl i { transform: scale(1.3); }

  /* ── Toast ── */
  #daemon-toggle {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 1000;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.6);
    border: 1px solid rgba(255,255,255,0.08);
  }

  #toast-container {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 9999;
    pointer-events: none;
  }
  .toast {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    max-width: 320px;
    animation: toast-in 0.15s ease;
  }
  .toast.error { border-color: var(--red);   color: var(--red); }
  .toast.ok    { border-color: var(--green); color: var(--green); }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<header>
  <h1>lydarr</h1>

  <span style="display:flex;align-items:center;gap:6px"><span class="dot" id="rt-dot"></span><span class="label-muted">Transmission</span></span>
  <span style="display:flex;align-items:center;gap:6px"><span class="dot" id="daemon-dot"></span><span class="label-muted">Daemon</span></span>

  <div class="spacer"></div>

  <div class="header-right">
    <div style="text-align:right;line-height:1.3">
      <div id="clock-time" style="font-size:14px;font-weight:600;font-variant-numeric:tabular-nums"></div>
      <div id="clock-tz" style="font-size:11px;color:var(--text-muted)"></div>
    </div>
  </div>
</header>

<main>
  <!-- LEFT: Anime Search -->
  <div class="panel" style="flex:1">
    <h2>Media Search</h2>
    <div class="type-toggle">
      <button id="toggle-anime" class="active" onclick="setSearchType('anime')">Anime</button>
      <button id="toggle-manga" onclick="setSearchType('manga')">Manga</button>
    </div>
    <div class="row">
      <div class="search-wrap">
        <input type="text" id="anime-q" placeholder="Search title..." onkeydown="if(event.key==='Enter')searchAnime()">
        <button class="clear-btn" onclick="clearAnimeSearch()" tabindex="-1" title="Clear">✕</button>
      </div>
      <button onclick="searchAnime()">Search</button>
    </div>
    <div id="anime-error"></div>
    <div id="anime-results" class="results"></div>
  </div>

  <div class="panel-resize-handle" data-min-left="200" data-min-right="250"></div>

  <!-- MIDDLE: Watchlist / Calendar -->
  <div class="panel" style="flex:1">
    <div class="tabs">
      <button class="tab active" id="tab-btn-watchlist" onclick="setPanelTab('watchlist')">Watchlist</button>
      <button class="tab" id="tab-btn-calendar" onclick="setPanelTab('calendar')">Calendar</button>
      <span style="flex:1"></span>
      <button class="secondary" style="font-size:11px;padding:2px 8px" onclick="refreshPanelTab()" title="Refresh">↺</button>
    </div>

    <div id="tab-pane-watchlist">
      <div id="watchlist-results" class="results"></div>
    </div>

    <div id="tab-pane-calendar" style="display:none">
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="secondary" onclick="calShift(-1)" title="Previous">‹</button>
          <button class="secondary" onclick="calToday()">Today</button>
          <button class="secondary" onclick="calShift(1)" title="Next">›</button>
        </div>
        <div class="cal-title" id="cal-title"></div>
        <div class="type-toggle cal-view-toggle">
          <button id="cal-view-month" class="active" onclick="setCalView('month')">Month</button>
          <button id="cal-view-week" onclick="setCalView('week')">Week</button>
        </div>
      </div>
      <div id="cal-error"></div>
      <div id="cal-body"></div>
    </div>
  </div>

  <div class="panel-resize-handle" data-min-left="250" data-min-right="350"></div>

  <!-- RIGHT: Torrent Browser -->
  <div class="panel" style="flex:1.5">
    <h2>Torrent Browser</h2>
    <div class="row">
      <div class="search-wrap">
        <input type="text" id="torrent-q" placeholder="Anime title..." onkeydown="if(event.key==='Enter')searchTorrents()">
        <button class="clear-btn" onclick="clearTorrentSearch()" tabindex="-1" title="Clear">✕</button>
      </div>
      <input type="number" id="torrent-ep" placeholder="Ep #" min="1">
      <select id="torrent-site">
        <option value="nyaa_si">Nyaa.si</option>
        <option value="sukebei">Sukebei</option>
        <option value="nyaa_land">Nyaa.land</option>
      </select>
      <button onclick="searchTorrents()">Search</button>
    </div>
    <div class="filters">
      <label><input type="checkbox" id="hevc-only" onchange="applyFilters()"> HEVC/x265 only</label>
      <label>Type:
        <select id="type-filter" onchange="applyFilters()" style="margin-left:4px">
          <option value="">All</option>
          <option value="trusted">Trusted</option>
          <option value="normal">Normal</option>
          <option value="remake">Remake</option>
        </select>
      </label>
    </div>
    <div id="torrent-error"></div>
    <div id="torrent-results" class="results"></div>
  </div>
</main>

<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────────────
let allTorrents = [];
let daemonRunning = false;
let transmissionOnline = false;
let searchType = 'anime';
let sortCol = 'seeders';
let sortAsc = false;
const _colWidths    = { name: 300, size: 75, seeders: 55, type: 80, magnet: 72, actions: 90 };
const _colMinWidths = { name:  80, size: 50, seeders: 45, type: 55, magnet: 70, actions: 85 };
let _colWidthsInit = false;
const tabState = {
  anime: { query: '', items: null },
  manga: { query: '', items: null },
};

// ── Polling ────────────────────────────────────────────────────────────────
function _updateToggleBtn() {
  const active = daemonRunning || transmissionOnline;
  const btn = document.getElementById('daemon-toggle');
  btn.textContent = active ? 'Stop' : 'Start';
  btn.className = active ? 'danger' : '';
}

async function pollRtorrent() {
  try {
    const r = await fetch('/api/rtorrent/status');
    const d = await r.json();
    transmissionOnline = d.online;
    document.getElementById('rt-dot').className = 'dot ' + (d.online ? 'green' : 'red');
    _updateToggleBtn();
  } catch {}
}

async function pollDaemon() {
  try {
    const r = await fetch('/api/daemon/status');
    const d = await r.json();
    daemonRunning = d.running;
    document.getElementById('daemon-dot').className = 'dot ' + (d.running ? 'green' : 'red');
    _updateToggleBtn();
  } catch {}
}

function fmtDate(iso) {
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  const month = pad(d.getMonth() + 1);
  const day = pad(d.getDate());
  const year = d.getFullYear();
  let h = d.getHours();
  const ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return `${month}/${day}/${year}, ${h}:${pad(d.getMinutes())} ${ampm}`;
}

function tzOffset() {
  const off = -new Date().getTimezoneOffset();
  const sign = off >= 0 ? '+' : '-';
  const h = Math.floor(Math.abs(off) / 60);
  const m = Math.abs(off) % 60;
  return 'UTC' + sign + h + (m ? ':' + String(m).padStart(2, '0') : '');
}

function tickClock() {
  const now = new Date();
  document.getElementById('clock-time').textContent = fmtDate(now.toISOString());
  document.getElementById('clock-tz').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone + ' (' + tzOffset() + ')';
}

async function toggleDaemon() {
  const btn = document.getElementById('daemon-toggle');
  btn.disabled = true;
  document.getElementById('rt-dot').className = 'dot grey';
  try {
    const stopping = daemonRunning && transmissionOnline;
    const daemonUrl = daemonRunning ? '/api/daemon/stop' : '/api/daemon/start';
    const daemonRes = await fetch(daemonUrl, { method: 'POST' });
    const daemonData = await daemonRes.json();
    if (!daemonData.ok && !daemonRunning) {
      showToast(daemonData.reason || 'Could not start daemon');
    }
    const txUrl = stopping ? '/api/transmission/stop' : '/api/transmission/start';
    const txRes = await fetch(txUrl, { method: 'POST' });
    const txData = await txRes.json();
    if (!txData.ok && !stopping) {
      showToast(txData.reason || 'Could not start Transmission');
    }
    await pollRtorrent();
    await pollDaemon();
  } finally {
    btn.disabled = false;
  }
}

// ── Anime Search ───────────────────────────────────────────────────────────
function setSearchType(type) {
  if (searchType === type) return;
  tabState[searchType].query = document.getElementById('anime-q').value;
  searchType = type;
  document.getElementById('toggle-anime').classList.toggle('active', type === 'anime');
  document.getElementById('toggle-manga').classList.toggle('active', type === 'manga');
  const state = tabState[type];
  document.getElementById('anime-q').value = state.query;
  document.getElementById('anime-error').innerHTML = '';
  if (state.items !== null) {
    renderAnimeResults(state.items);
  } else {
    document.getElementById('anime-results').innerHTML = '';
  }
}

function clearAnimeSearch() {
  document.getElementById('anime-q').value = '';
  document.getElementById('anime-q').focus();
  tabState[searchType].query = '';
  tabState[searchType].items = null;
  document.getElementById('anime-results').innerHTML = '';
  document.getElementById('anime-error').innerHTML = '';
}

async function searchAnime() {
  const q = document.getElementById('anime-q').value.trim();
  if (!q) return;
  const errEl = document.getElementById('anime-error');
  const resEl = document.getElementById('anime-results');
  errEl.innerHTML = '';
  resEl.innerHTML = '<span class="spinner"></span>';
  try {
    const r = await fetch('/api/anime/search?q=' + encodeURIComponent(q) + '&type=' + searchType);
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    tabState[searchType].query = q;
    tabState[searchType].items = data;
    renderAnimeResults(data);
  } catch (e) {
    errEl.innerHTML = `<div class="error-banner">${esc(e.message)}</div>`;
    resEl.innerHTML = '';
  }
}

function statusBadge(status) {
  const cls = (status || 'unknown').toLowerCase();
  return `<span class="badge ${cls}">${status || 'Unknown'}</span>`;
}

const _STATUS_PRIORITY = { releasing: 0, not_yet_released: 1, hiatus: 2, unknown: 3, finished: 4, cancelled: 5 };

function renderAnimeResults(items) {
  const el = document.getElementById('anime-results');
  if (!items.length) { el.innerHTML = '<p class="empty-msg">No results.</p>'; return; }
  const sorted = [...items].sort((a, b) => {
    const pa = _STATUS_PRIORITY[(a.status || '').toLowerCase()] ?? 3;
    const pb = _STATUS_PRIORITY[(b.status || '').toLowerCase()] ?? 3;
    return pa - pb;
  });
  el._results = sorted;
  el.innerHTML = sorted.map((a, i) => {
    const countText = a.type === 'manga'
      ? (a.chapters ? `${a.chapters} ch` : 'ongoing')
      : (a.episodes ? `${a.episodes} eps` : '');
    const nextText = a.next_airing_episode && a.next_airing_at
      ? `ep ${a.next_airing_episode} airs ${fmtDate(new Date(a.next_airing_at * 1000).toISOString())}`
      : '';
    const meta = [countText, nextText].filter(Boolean).join(' · ');
    const imgHtml = a.cover_image
      ? `<img class="anime-card-img" src="${esc(a.cover_image)}" alt="">`
      : `<div class="anime-card-img"></div>`;
    return `
    <div class="anime-card">
      ${imgHtml}
      <div class="info">
        <div class="title">${esc(a.title)}</div>
        <div class="meta">${statusBadge(a.status)}${meta ? `<span>${esc(meta)}</span>` : ''}</div>
      </div>
      <button class="track-btn secondary" onclick="trackAnime(${i}, this)">Track</button>
    </div>`;
  }).join('');
}

async function trackAnime(idx, btn) {
  const item = document.getElementById('anime-results')._results?.[idx];
  if (!item) return;
  btn.disabled = true;
  try {
    const r = await fetch('/api/anime/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: item.title, type: searchType }),
    });
    const d = await r.json();
    if (d.added) {
      btn.textContent = 'Added';
      showToast('Added: ' + item.title, 'ok');
      loadWatchlist();
    } else {
      btn.disabled = false;
      showToast(d.reason || 'Not added');
    }
  } catch (e) {
    btn.disabled = false;
    showToast('Error: ' + e.message);
  }
}

function clearTorrentSearch() {
  _watchlistTitle = null;
  document.getElementById('torrent-q').value = '';
  document.getElementById('torrent-q').focus();
  allTorrents = [];
  document.getElementById('torrent-results').innerHTML = '';
  document.getElementById('torrent-error').innerHTML = '';
}

// ── Torrent Search ─────────────────────────────────────────────────────────
async function searchTorrents() {
  const q = document.getElementById('torrent-q').value.trim();
  if (!q) return;
  const ep = document.getElementById('torrent-ep').value;
  const site = document.getElementById('torrent-site').value;
  const errEl = document.getElementById('torrent-error');
  const resEl = document.getElementById('torrent-results');
  errEl.innerHTML = '';
  resEl.innerHTML = '<span class="spinner"></span>';
  let url = '/api/torrents/search?q=' + encodeURIComponent(q) + '&site=' + site;
  if (ep) url += '&ep=' + encodeURIComponent(ep);
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(await r.text());
    allTorrents = await r.json();
    applyFilters();
  } catch (e) {
    errEl.innerHTML = `<div class="error-banner">${esc(e.message)}</div>`;
    resEl.innerHTML = '';
  }
}

function parseSize(s) {
  const m = String(s).match(/([\d.]+)\s*(B|KiB|MiB|GiB|TiB)/i);
  if (!m) return 0;
  const u = {b:1, kib:1024, mib:1024**2, gib:1024**3, tib:1024**4};
  return parseFloat(m[1]) * (u[m[2].toLowerCase()] || 1);
}

function applySort(items) {
  if (!sortCol) return items;
  return [...items].sort((a, b) => {
    let av, bv;
    if      (sortCol === 'name')    { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
    else if (sortCol === 'size')    { av = parseSize(a.size);    bv = parseSize(b.size); }
    else if (sortCol === 'seeders') { av = a.seeders;            bv = b.seeders; }
    else if (sortCol === 'type')    { av = a.type;               bv = b.type; }
    else return 0;
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = col === 'name' || col === 'type'; }
  applyFilters();
}

function applyFilters() {
  const hevcOnly = document.getElementById('hevc-only').checked;
  const typeFilter = document.getElementById('type-filter').value;
  let filtered = allTorrents;
  if (hevcOnly) filtered = filtered.filter(t => /hevc|x265/i.test(t.name));
  if (typeFilter) filtered = filtered.filter(t => t.type === typeFilter);
  renderTorrents(applySort(filtered));
}

function typeBadge(type) {
  const map = { trusted: 'Trusted', normal: 'Normal', remake: 'Remake' };
  const safe = map[type] ? type : 'normal';
  return `<span class="badge ${safe}">${map[safe]}</span>`;
}

function renderTorrents(items) {
  const el = document.getElementById('torrent-results');
  if (!items.length) { el.innerHTML = '<p class="empty-msg">No results.</p>'; return; }
  if (!_colWidthsInit) {
    const w = el.offsetWidth;
    if (w > 0) {
      const total = Object.values(_colWidths).reduce((a, b) => a + b, 0);
      const scale = w / total;
      for (const k of Object.keys(_colWidths)) _colWidths[k] = Math.max(40, Math.floor(_colWidths[k] * scale));
      _colWidthsInit = true;
    }
  }
  const rows = items.map((t, i) => `
    <tr>
      <td class="name-cell" title="${esc(t.name)}">${esc(t.name)}</td>
      <td>${esc(t.size)}</td>
      <td class="seeders">${t.seeders}</td>
      <td>${typeBadge(t.type)}</td>
      <td>${t.magnet ? `<a class="magnet-link" href="${esc(t.magnet)}" title="magnet">⋯magnet</a>` : '—'}</td>
      <td>
        <button class="add-btn secondary" onclick="addTorrent(${i}, this)">Add</button>
        <span id="torrent-msg-${i}" class="inline-msg"></span>
      </td>
    </tr>`).join('');
  el.innerHTML = `
    <table class="torrent-table">
      <thead><tr>
        <th class="sortable" style="width:${_colWidths.name}px"    onclick="sortBy('name')"   >Name    <span class="sort-arrow" id="sa-name"></span><div class="col-resize-handle" data-col="name"></div></th>
        <th class="sortable" style="width:${_colWidths.size}px"    onclick="sortBy('size')"   >Size    <span class="sort-arrow" id="sa-size"></span><div class="col-resize-handle" data-col="size"></div></th>
        <th class="sortable" style="width:${_colWidths.seeders}px" onclick="sortBy('seeders')">Seeds   <span class="sort-arrow" id="sa-seeders"></span><div class="col-resize-handle" data-col="seeders"></div></th>
        <th class="sortable" style="width:${_colWidths.type}px"    onclick="sortBy('type')"   >Type    <span class="sort-arrow" id="sa-type"></span><div class="col-resize-handle" data-col="type"></div></th>
        <th style="width:${_colWidths.magnet}px">Magnet<div class="col-resize-handle" data-col="magnet"></div></th>
        <th style="width:${_colWidths.actions}px"></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

  el._filtered = items;
  // Update sort arrows
  for (const col of ['name', 'size', 'seeders', 'type']) {
    const el2 = document.getElementById('sa-' + col);
    if (el2) el2.textContent = sortCol === col ? (sortAsc ? ' ▲' : ' ▼') : '';
  }
}

async function addTorrent(idx, btn) {
  const el = document.getElementById('torrent-results');
  const items = el._filtered || [];
  const t = items[idx];
  if (!t || !t.magnet) {
    showToast('No magnet link available');
    return;
  }
  btn.disabled = true;
  const msgEl = document.getElementById('torrent-msg-' + idx);
  msgEl.textContent = '…';
  try {
    const r = await fetch('/api/torrents/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ magnet: t.magnet, title: _watchlistTitle || document.getElementById('torrent-q').value.trim() || null }),
    });
    const d = await r.json();
    if (d.ok) {
      msgEl.className = 'inline-msg ok';
      msgEl.textContent = '✓';
      btn.textContent = 'Added';
    } else {
      showToast(d.error || 'Failed to add torrent');
      msgEl.textContent = '';
      btn.disabled = false;
    }
  } catch (e) {
    showToast('Network error');
    msgEl.textContent = '';
    btn.disabled = false;
  }
}

// ── Watchlist ─────────────────────────────────────────────────────────────
let watchlistEntries = [];

async function loadWatchlist() {
  const el = document.getElementById('watchlist-results');
  try {
    const r = await fetch('/api/anime/list');
    const entries = await r.json();
    watchlistEntries = entries;
    // The tracked set drives the calendar, so cached ranges no longer apply.
    calCache.clear();
    if (!entries.length) {
      el.innerHTML = '<p class="empty-msg">No anime tracked.</p>';
      return;
    }
    const sorted = [...entries].sort((a, b) => (a.deprecated ? 1 : 0) - (b.deprecated ? 1 : 0));
    el.innerHTML = sorted.map((e, i) => {
      const typeBadgeHtml = `<span class="badge ${e.type === 'manga' ? 'manga-badge' : 'anime-badge'}">${esc(e.type.toUpperCase())}</span>`;
      const tags = e.submitters.map(s => `<span class="sub-tag">${esc(s)}</span>`).join('');
      const subsLabel = e.submitters.length ? tags : '<span class="label-muted" style="font-size:11px">all uploaders</span>';
      const chText = e.type === 'manga' && e.last_chapter > 0 ? `<span class="label-muted" style="font-size:11px">ch.${String(e.last_chapter).padStart(3,'0')} tracked</span>` : '';
      const delayText = e.type !== 'manga' && e.check_delay ? `<span class="label-muted" style="font-size:11px">+${e.check_delay}m after air</span>` : '';
      if (e.deprecated) {
        return `
      <div class="watchlist-item deprecated" id="wl-item-${i}">
        <div class="info" style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px">${typeBadgeHtml}<span class="wl-title-text">${esc(e.title)}</span></div>
          <div class="wl-subs">${subsLabel}${chText}${delayText}
            <button class="secondary" style="padding:1px 6px;font-size:11px" disabled>✎</button><span id="wl-status-${i}" class="label-muted" style="font-size:11px"></span>
          </div>
        </div>
        <button class="success" style="padding:3px 10px;font-size:12px" data-title="${esc(e.title)}" onclick="reactivateAnime(this)">Reactivate</button>
        <button class="remove-btn danger" data-title="${esc(e.title)}" onclick="removeAnime(this)">Remove</button>
      </div>`;
      }
      return `
      <div class="watchlist-item" id="wl-item-${i}">
        <div class="info" style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px">${typeBadgeHtml}<button class="wl-title-btn" data-title="${esc(e.title)}" data-type="${esc(e.type)}" data-searchname="${esc(e.search_name || '')}" onclick="searchFromWatchlist(this)">${esc(e.title)}</button></div>
          <div class="wl-subs">${subsLabel}${chText}${delayText}
            <button class="secondary" style="padding:1px 6px;font-size:11px" onclick="toggleEditSubs(${i})">✎</button><span id="wl-status-${i}" class="label-muted" style="font-size:11px"></span>
          </div>
          <div id="wl-edit-${i}" style="display:none;flex-direction:column;gap:5px;margin-top:6px">
            <div>
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">Search name (Nyaa override)</div>
              <input type="text" id="wl-sn-input-${i}" style="width:100%;font-size:12px" placeholder="Leave blank to use title" value="${esc(e.search_name || '')}">
            </div>
            <div>
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">Submitters</div>
              <input type="text" id="wl-sub-input-${i}" style="width:100%;font-size:12px" placeholder="SubsPlease, Erai-raws" value="${esc(e.submitters.join(', '))}">
            </div>
            <div>
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">Save path</div>
              <input type="text" id="wl-dir-input-${i}" style="width:100%;font-size:12px" data-default="${esc(e.default_path || '')}" placeholder="${esc(e.default_path || '')}" value="${esc(e.download_dir || e.default_path || '')}">
            </div>
            ${e.type === 'manga' ? '' : `
            <div>
              <div style="font-size:11px;color:var(--text-muted);margin-bottom:3px">Check delay (minutes after air time)</div>
              <input type="number" min="0" step="1" id="wl-delay-input-${i}" style="width:100%;font-size:12px" data-default="${e.default_check_delay}" placeholder="${e.default_check_delay}" value="${e.check_delay || e.default_check_delay}">
            </div>`}
            <div style="display:flex;gap:6px">
              <button data-title="${esc(e.title)}" onclick="saveSubs(${i}, this)" style="padding:3px 10px;font-size:12px">Save</button>
              <button class="secondary" onclick="toggleEditSubs(${i})" style="padding:3px 10px;font-size:12px">Cancel</button>
            </div>
          </div>
        </div>
        <button class="secondary" style="padding:3px 10px;font-size:12px" data-title="${esc(e.title)}" onclick="deprecateAnime(this)">Deprecate</button>
        <button class="remove-btn danger" data-title="${esc(e.title)}" onclick="removeAnime(this)">Remove</button>
      </div>`;
    }).join('');
    sorted.forEach((e, i) => fetchWatchlistStatus(e, i));
  } catch (e) {
    el.innerHTML = '<p class="empty-msg err">Error loading watchlist.</p>';
  }
}

async function fetchWatchlistStatus(entry, idx) {
  const el = document.getElementById('wl-status-' + idx);
  if (!el) return;
  try {
    const r = await fetch('/api/anime/status?title=' + encodeURIComponent(entry.title) + '&type=' + entry.type);
    const d = await r.json();
    if (!d.status) return;
    const s = d.status.toLowerCase();
    if (s === 'finished' || s === 'cancelled') {
      el.textContent = 'Completed';
    } else if ((s === 'releasing' || s === 'ongoing') && d.next_airing_at && d.next_airing_episode) {
      el.textContent = 'Ep ' + d.next_airing_episode + ' · ' + fmtDate(new Date(d.next_airing_at * 1000).toISOString());
    } else if (s === 'not_yet_released') {
      el.textContent = 'Upcoming';
    } else if (s === 'hiatus') {
      el.textContent = 'Hiatus';
    } else {
      el.textContent = d.status;
    }
  } catch { /* silently ignore */ }
}

let _watchlistTitle = null;

function searchFromWatchlist(btn) {
  const title = btn.dataset.title;
  const type = btn.dataset.type || 'anime';
  const item = btn.closest('.watchlist-item');
  const snInput = item && item.querySelector('[id^="wl-sn-input-"]');
  const searchName = (snInput && snInput.value.trim()) || btn.dataset.searchname || title;
  _watchlistTitle = title;
  setSearchType(type);
  document.getElementById('torrent-q').value = searchName;
  document.getElementById('torrent-ep').value = '';
  searchTorrents();
}

function toggleEditSubs(idx) {
  const row = document.getElementById('wl-edit-' + idx);
  row.style.display = row.style.display === 'none' ? 'flex' : 'none';
}

async function saveSubs(idx, btn) {
  const title = btn.dataset.title;
  const subInput = document.getElementById('wl-sub-input-' + idx);
  const snInput = document.getElementById('wl-sn-input-' + idx);
  const dirInput = document.getElementById('wl-dir-input-' + idx);
  const delayInput = document.getElementById('wl-delay-input-' + idx);
  const submitters = subInput.value.split(',').map(s => s.trim()).filter(Boolean);
  const search_name = snInput ? snInput.value.trim() : '';
  let download_dir = dirInput ? dirInput.value.trim() : '';
  if (dirInput && download_dir === (dirInput.dataset.default || '')) download_dir = '';
  let check_delay = 0;
  if (delayInput && delayInput.value.trim() !== '' && delayInput.value.trim() !== delayInput.dataset.default) {
    check_delay = Math.max(0, parseInt(delayInput.value, 10) || 0);
  }
  try {
    await fetch('/api/anime/submitters', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, submitters, search_name, download_dir, check_delay }),
    });
    toggleEditSubs(idx);
    loadWatchlist();
  } catch { /* silently ignore */ }
}

async function deprecateAnime(btn) {
  const title = btn.dataset.title;
  btn.disabled = true;
  try {
    const r = await fetch('/api/anime/deprecate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title }),
    });
    const d = await r.json();
    if (d.ok) { loadWatchlist(); } else { btn.disabled = false; }
  } catch { btn.disabled = false; }
}

async function reactivateAnime(btn) {
  const title = btn.dataset.title;
  btn.disabled = true;
  try {
    const r = await fetch('/api/anime/reactivate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title }),
    });
    const d = await r.json();
    if (d.ok) { loadWatchlist(); } else { btn.disabled = false; }
  } catch { btn.disabled = false; }
}

async function removeAnime(btn) {
  const title = btn.dataset.title;
  btn.disabled = true;
  try {
    const r = await fetch('/api/anime/remove', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, type: searchType }),
    });
    const d = await r.json();
    if (d.removed) {
      btn.closest('.watchlist-item').remove();
      watchlistEntries = watchlistEntries.filter(e => e.title !== title);
      calCache.clear();
      const el = document.getElementById('watchlist-results');
      if (!el.children.length) el.innerHTML = '<p class="empty-msg">No anime tracked.</p>';
    } else {
      btn.disabled = false;
    }
  } catch {
    btn.disabled = false;
  }
}

// ── Panel tabs ────────────────────────────────────────────────────────────
let panelTab = 'watchlist';

function setPanelTab(tab) {
  panelTab = tab;
  for (const t of ['watchlist', 'calendar']) {
    document.getElementById('tab-btn-' + t).classList.toggle('active', t === tab);
    document.getElementById('tab-pane-' + t).style.display = t === tab ? '' : 'none';
  }
  if (tab === 'calendar') loadCalendar();
}

function refreshPanelTab() {
  if (panelTab === 'calendar') loadCalendar(true);
  else loadWatchlist();
}

// ── Calendar ──────────────────────────────────────────────────────────────
const CAL_COLORS = ['#7c6af7','#22c55e','#3b82f6','#f59e0b','#ec4899','#14b8a6','#ef4444','#a855f7','#84cc16','#f97316'];
const HOUR_PX = 44;
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let calView = 'month';
let calCursor = startOfDay(new Date());
let calEvents = [];
let calLoading = false;
let calError = '';
let calNote = '';
let calExpandedDay = null;
let calScrolledOnce = false;
const calCache = new Map();

function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function startOfWeek(d) { const x = startOfDay(d); return addDays(x, -x.getDay()); }
function dayKey(d) { return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function isToday(d) { return dayKey(d) === dayKey(new Date()); }

function calRange() {
  if (calView === 'week') return { start: startOfWeek(calCursor), days: 7 };
  const first = new Date(calCursor.getFullYear(), calCursor.getMonth(), 1);
  const last = new Date(calCursor.getFullYear(), calCursor.getMonth() + 1, 0);
  const start = startOfWeek(first);
  const end = addDays(startOfWeek(last), 7);
  return { start, days: Math.round((end - start) / 86400000) };
}

function calRangeKey() {
  const { start, days } = calRange();
  return `${start.getTime()}-${days}`;
}

function calTitle() {
  if (calView === 'month') return `${MONTHS[calCursor.getMonth()]} ${calCursor.getFullYear()}`;
  const start = calRange().start;
  const end = addDays(start, 6);
  const right = start.getMonth() === end.getMonth()
    ? `${end.getDate()}`
    : `${MONTHS_SHORT[end.getMonth()]} ${end.getDate()}`;
  return `${MONTHS_SHORT[start.getMonth()]} ${start.getDate()} – ${right}, ${end.getFullYear()}`;
}

function setCalView(view) {
  if (calView === view) return;
  calView = view;
  calScrolledOnce = false;
  calExpandedDay = null;
  document.getElementById('cal-view-month').classList.toggle('active', view === 'month');
  document.getElementById('cal-view-week').classList.toggle('active', view === 'week');
  loadCalendar();
}

function calShift(dir) {
  calCursor = calView === 'week'
    ? addDays(calCursor, 7 * dir)
    : new Date(calCursor.getFullYear(), calCursor.getMonth() + dir, 1);
  calExpandedDay = null;
  loadCalendar();
}

function calToday() {
  calCursor = startOfDay(new Date());
  calExpandedDay = null;
  calScrolledOnce = false;
  loadCalendar();
}

async function loadCalendar(force = false) {
  const { start, days } = calRange();
  const end = addDays(start, days);
  const key = calRangeKey();
  if (force) calCache.delete(key);

  calError = '';
  calNote = '';
  if (calCache.has(key)) {
    const hit = calCache.get(key);
    calEvents = hit.episodes;
    calNote = hit.note;
    calLoading = false;
    renderCalendar();
    return;
  }

  calEvents = [];
  calLoading = true;
  renderCalendar();

  let episodes = [], note = '', failed = '';
  try {
    const r = await fetch('/api/anime/calendar?start=' + Math.floor(start.getTime() / 1000) +
                          '&end=' + Math.floor(end.getTime() / 1000));
    const d = await r.json();
    episodes = d.episodes || [];
    if (d.error) failed = 'AniList: ' + d.error;
    if ((d.unresolved || []).length) note = 'Not found on AniList: ' + d.unresolved.join(', ');
    if (!failed) calCache.set(key, { episodes, note });
  } catch {
    failed = 'Error loading calendar.';
  }

  // The user may have paged to another range while this was in flight.
  if (calRangeKey() !== key) return;
  calEvents = episodes;
  calNote = note;
  calError = failed;
  calLoading = false;
  renderCalendar();
}

function calColor(title) {
  let h = 0;
  for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) >>> 0;
  return CAL_COLORS[h % CAL_COLORS.length];
}

function fmtClock(d) {
  const h = d.getHours();
  const m = d.getMinutes();
  const suffix = h >= 12 ? 'p' : 'a';
  const h12 = h % 12 || 12;
  return m ? `${h12}:${String(m).padStart(2, '0')}${suffix}` : `${h12}${suffix}`;
}

function calEventsByDay() {
  const map = new Map();
  for (const e of calEvents) {
    const k = dayKey(new Date(e.airing_at * 1000));
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(e);
  }
  for (const list of map.values()) list.sort((a, b) => a.airing_at - b.airing_at);
  return map;
}

let calHighlighted = null;

// Hovering an episode picks its show out of the colour key below the grid.
function calHighlight(title) {
  if (title === calHighlighted) return;
  calHighlighted = title;
  document.querySelectorAll('#cal-body .cal-legend span').forEach(el => {
    el.classList.toggle('hl', title !== null && el.dataset.title === title);
  });
}

function _initCalHover() {
  const body = document.getElementById('cal-body');
  body.addEventListener('mouseover', e => {
    const item = e.target.closest('.cal-chip, .cal-event');
    calHighlight(item ? item.dataset.title : null);
  });
  body.addEventListener('mouseleave', () => calHighlight(null));
}

function renderCalendar() {
  calHighlighted = null;
  document.getElementById('cal-title').innerHTML =
    esc(calTitle()) + (calLoading ? ' <span class="spinner"></span>' : '');
  document.getElementById('cal-error').innerHTML =
    calError ? `<div class="error-banner">${esc(calError)}</div>` : '';
  const body = document.getElementById('cal-body');
  if (calView === 'week') renderCalWeek(body);
  else renderCalMonth(body);
}

function calFooter() {
  const titles = [...new Set(calEvents.map(e => e.title))].sort();
  const legend = titles.length
    ? `<div class="cal-legend">${titles.map(t =>
        `<span data-title="${esc(t)}"><i style="background:${calColor(t)}"></i>${esc(t)}</span>`).join('')}</div>`
    : `<p class="empty-msg">${calLoading ? 'Loading…' : 'No episodes scheduled in this range.'}</p>`;
  const note = calNote ? `<p class="label-muted" style="margin-top:6px">${esc(calNote)}</p>` : '';
  return legend + note;
}

function calChipHtml(e) {
  const c = calColor(e.title);
  const t = new Date(e.airing_at * 1000);
  return `<button class="cal-chip" style="border-left-color:${c};background:${c}26"
    data-title="${esc(e.title)}" data-ep="${e.episode}" onclick="calSearch(this)"
    title="${esc(e.title)} · Ep ${e.episode} · ${esc(fmtClock(t))}"
    ><span class="t">${esc(fmtClock(t))}</span><span class="n">${esc(e.title)}</span><span class="t">E${e.episode}</span></button>`;
}

function calToggleDay(key) {
  calExpandedDay = calExpandedDay === key ? null : key;
  renderCalendar();
}

function renderCalMonth(body) {
  const { start, days } = calRange();
  const byDay = calEventsByDay();
  const month = calCursor.getMonth();
  const cells = DOW.map(d => `<div class="cal-dow">${d}</div>`);

  for (let i = 0; i < days; i++) {
    const day = addDays(start, i);
    const key = dayKey(day);
    const evs = byDay.get(key) || [];
    const expanded = calExpandedDay === key;
    const shown = expanded ? evs : evs.slice(0, 3);
    let more = '';
    if (evs.length > shown.length) {
      more = `<button class="cal-more" onclick="calToggleDay('${key}')">+${evs.length - shown.length} more</button>`;
    } else if (expanded && evs.length > 3) {
      more = `<button class="cal-more" onclick="calToggleDay('${key}')">less</button>`;
    }
    cells.push(`<div class="cal-day${day.getMonth() === month ? '' : ' other'}${isToday(day) ? ' today' : ''}">
      <div class="cal-daynum">${day.getDate()}</div>${shown.map(calChipHtml).join('')}${more}</div>`);
  }

  body.innerHTML = `<div class="cal-month">${cells.join('')}</div>` + calFooter();
}

// Assigns side-by-side columns to episodes that air at overlapping times.
function calLayoutDay(evs) {
  const items = evs.map(e => {
    const t = new Date(e.airing_at * 1000);
    const startMin = t.getHours() * 60 + t.getMinutes();
    return { ...e, _start: startMin, _end: startMin + (e.duration || 24) };
  }).sort((a, b) => a._start - b._start);

  const out = [];
  let cluster = [], clusterEnd = -1;
  const flush = () => {
    if (!cluster.length) return;
    const colEnds = [];
    for (const ev of cluster) {
      let col = colEnds.findIndex(end => end <= ev._start);
      if (col === -1) { col = colEnds.length; colEnds.push(ev._end); }
      else colEnds[col] = ev._end;
      ev.col = col;
    }
    for (const ev of cluster) { ev.cols = colEnds.length; out.push(ev); }
    cluster = [];
    clusterEnd = -1;
  };
  for (const ev of items) {
    if (cluster.length && ev._start >= clusterEnd) flush();
    cluster.push(ev);
    clusterEnd = Math.max(clusterEnd, ev._end);
  }
  flush();
  return out;
}

function nowTopPx() {
  const now = new Date();
  return ((now.getHours() * 60 + now.getMinutes()) / 60 * HOUR_PX).toFixed(1);
}

function renderCalWeek(body) {
  const start = calRange().start;
  const byDay = calEventsByDay();

  const head = ['<div></div>'];
  const cols = [];
  for (let i = 0; i < 7; i++) {
    const day = addDays(start, i);
    head.push(`<div class="${isToday(day) ? 'is-today' : ''}">${DOW[i]}<span class="dnum">${day.getDate()}</span></div>`);

    const blocks = calLayoutDay(byDay.get(dayKey(day)) || []).map(ev => {
      const c = calColor(ev.title);
      const t = new Date(ev.airing_at * 1000);
      const top = ev._start / 60 * HOUR_PX;
      const height = Math.max(21, (ev._end - ev._start) / 60 * HOUR_PX);
      const width = 100 / ev.cols;
      return `<button class="cal-event${height < 30 ? ' short' : ''}" data-title="${esc(ev.title)}" data-ep="${ev.episode}"
        onclick="calSearch(this)" title="${esc(ev.title)} · Ep ${ev.episode} · ${esc(fmtClock(t))}"
        style="top:${top.toFixed(1)}px;height:${height.toFixed(1)}px;left:calc(${(ev.col * width).toFixed(2)}% + 2px);width:calc(${width.toFixed(2)}% - 4px);border-left-color:${c};background:${c}33"
        ><span class="ev-t">${esc(fmtClock(t))}</span><span class="ev-n">${esc(ev.title)}</span><span class="ev-t">E${ev.episode}</span></button>`;
    }).join('');

    const nowLine = isToday(day) ? `<div class="cal-now" style="top:${nowTopPx()}px"></div>` : '';
    cols.push(`<div class="cal-col${isToday(day) ? ' today-col' : ''}" style="height:${24 * HOUR_PX}px">${blocks}${nowLine}</div>`);
  }

  const gutter = [];
  for (let h = 0; h < 24; h++) {
    gutter.push(`<div class="cal-gutter-hour">${h === 0 ? '' : (h % 12 || 12) + (h < 12 ? 'am' : 'pm')}</div>`);
  }

  const prev = document.getElementById('cal-grid-scroll');
  const prevTop = prev ? prev.scrollTop : null;

  body.innerHTML = `<div class="cal-week"><div class="cal-week-scroll"><div class="cal-week-inner">
      <div class="cal-week-head">${head.join('')}</div>
      <div class="cal-grid-scroll" id="cal-grid-scroll">
        <div class="cal-grid"><div>${gutter.join('')}</div>${cols.join('')}</div>
      </div>
    </div></div></div>` + calFooter();

  const scroller = document.getElementById('cal-grid-scroll');
  if (calScrolledOnce && prevTop !== null) {
    scroller.scrollTop = prevTop;
  } else {
    const hours = calEvents.map(e => new Date(e.airing_at * 1000).getHours());
    const anchor = hours.length ? Math.min(...hours) : new Date().getHours();
    scroller.scrollTop = Math.max(0, (anchor - 1) * HOUR_PX);
    calScrolledOnce = true;
  }
}

function calUpdateNowLine() {
  const line = document.querySelector('#tab-pane-calendar .cal-now');
  if (line) line.style.top = nowTopPx() + 'px';
}

function calSearch(btn) {
  const title = btn.dataset.title;
  const entry = watchlistEntries.find(e => e.title === title);
  _watchlistTitle = title;
  setSearchType('anime');
  document.getElementById('torrent-q').value = (entry && entry.search_name) || title;
  document.getElementById('torrent-ep').value = btn.dataset.ep || '';
  searchTorrents();
}

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg, type = 'error') {
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ── Utilities ─────────────────────────────────────────────────────────────
function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──────────────────────────────────────────────────────────────────
function _initPanelResize() {
  let _panelResized = false;
  let _lastMainW = 0;
  const _panelMins = [200, 250, 350];

  document.addEventListener('mousedown', e => {
    const handle = e.target.closest('.panel-resize-handle');
    if (!handle) return;
    e.preventDefault();
    const left = handle.previousElementSibling;
    const right = handle.nextElementSibling;
    if (!left || !right) return;
    const startX = e.pageX;
    const startLeft = left.offsetWidth;
    const startRight = right.offsetWidth;
    const total = startLeft + startRight;
    const minLeft  = parseInt(handle.dataset.minLeft  || 150);
    const minRight = parseInt(handle.dataset.minRight || 150);
    handle.classList.add('resizing');
    function onMove(ev) {
      const delta = ev.pageX - startX;
      let newLeft  = startLeft  + delta;
      let newRight = startRight - delta;
      if (newLeft < minLeft)        { newLeft = minLeft;         newRight = total - minLeft; }
      else if (newRight < minRight) { newRight = minRight;       newLeft  = total - minRight; }
      left.style.flex  = `0 0 ${newLeft}px`;
      right.style.flex = `0 0 ${newRight}px`;
    }
    function onUp() {
      handle.classList.remove('resizing');
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      _panelResized = true;
      _lastMainW = document.querySelector('main').offsetWidth;
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  window.addEventListener('resize', () => {
    if (!_panelResized || window.innerWidth <= 850) return;
    const main = document.querySelector('main');
    if (!main) return;
    const newW = main.offsetWidth;
    if (!_lastMainW || newW === _lastMainW) { _lastMainW = newW; return; }
    const scale = newW / _lastMainW;
    const panels = [...main.children].filter(el => el.classList.contains('panel'));
    panels.forEach((p, i) => {
      const w = Math.max(_panelMins[i] || 150, Math.round(p.offsetWidth * scale));
      p.style.flex = `0 0 ${w}px`;
    });
    _lastMainW = newW;
  });
}

function _initColResize() {
  let dragTh = null, startX = 0, startW = 0;
  document.addEventListener('click', e => {
    if (e.target.closest('.col-resize-handle')) e.stopPropagation();
  }, true);
  document.addEventListener('mousedown', e => {
    const handle = e.target.closest('.col-resize-handle');
    if (!handle) return;
    e.preventDefault();
    e.stopPropagation();
    dragTh = handle.closest('th');
    startX = e.pageX;
    startW = dragTh.offsetWidth;
    handle.classList.add('resizing');
    const col = handle.dataset.col;
    function onMove(ev) {
      const w = Math.max(_colMinWidths[col] ?? 40, startW + (ev.pageX - startX));
      dragTh.style.width = w + 'px';
      if (col) _colWidths[col] = w;
    }
    function onUp() {
      document.querySelectorAll('.col-resize-handle.resizing').forEach(h => h.classList.remove('resizing'));
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}
_initPanelResize();
_initColResize();
_initCalHover();
pollRtorrent();
pollDaemon();
loadWatchlist();
tickClock();
setInterval(tickClock, 1000);
setInterval(pollRtorrent, 10000);
setInterval(pollDaemon, 5000);
setInterval(calUpdateNowLine, 60000);
</script>
