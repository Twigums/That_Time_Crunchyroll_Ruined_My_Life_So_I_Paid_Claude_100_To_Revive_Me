<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>lydarr</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-view="watchlist">

<header class="bar">
  <h1>lydarr</h1>
  <div class="services">
    <button class="pill" id="pill-tracker" type="button" title="Start or stop the tracker">
      <i></i><span>Tracker</span><b>…</b>
    </button>
    <button class="pill" id="pill-transmission" type="button" title="Start or stop Transmission">
      <i></i><span>Transmission</span><b>…</b>
    </button>
  </div>
  <span class="grow"></span>
  <span class="freshness" id="anilist-state"></span>
  <button class="icon-btn" id="refresh" type="button" title="Refresh AniList data" aria-label="Refresh AniList data">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.6 8a5.6 5.6 0 1 1-1.7-4M12.5 1.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <span class="clock" id="clock"></span>
  <button class="btn primary" id="power" type="button">Start</button>
</header>

<main>
  <section class="panel" id="panel-search" aria-label="Add a show">
    <div class="panel-head">
      <h2>Add a show</h2>
      <div class="segmented" id="search-type" role="group" aria-label="Type">
        <button type="button" class="active" data-type="anime">Anime</button>
        <button type="button" data-type="manga">Manga</button>
      </div>
      <form class="field-row" id="search-form">
        <input type="search" id="search-q" placeholder="Search AniList" aria-label="Search AniList" autocomplete="off">
        <button class="btn" type="submit">Search</button>
      </form>
    </div>
    <div class="scroll" id="search-results"></div>
  </section>

  <div class="splitter" data-side="search" role="separator" aria-orientation="vertical"></div>

  <section class="panel" id="panel-middle" aria-label="Watchlist">
    <nav class="tabs">
      <button type="button" data-view="watchlist" class="active">Watchlist</button>
      <button type="button" data-view="calendar">Calendar</button>
      <button type="button" data-view="activity">Activity<span class="count" data-review-count hidden></span></button>
    </nav>
    <div class="scroll pane" id="pane-watchlist"></div>
    <div class="scroll pane" id="pane-calendar" hidden>
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="btn" type="button" id="cal-prev" aria-label="Previous">‹</button>
          <button class="btn" type="button" id="cal-today">Today</button>
          <button class="btn" type="button" id="cal-next" aria-label="Next">›</button>
        </div>
        <div class="cal-title" id="cal-title"></div>
        <div class="segmented" id="cal-mode" role="group" aria-label="Calendar layout">
          <button type="button" data-mode="list">List</button>
          <button type="button" data-mode="week">Week</button>
          <button type="button" data-mode="month">Month</button>
        </div>
      </div>
      <div id="cal-note"></div>
      <div id="cal-body"></div>
    </div>
    <div class="scroll pane" id="pane-activity" hidden></div>
  </section>

  <div class="splitter" data-side="torrents" role="separator" aria-orientation="vertical"></div>

  <section class="panel" id="panel-torrents" aria-label="Torrents">
    <div class="panel-head">
      <h2>Torrents</h2>
      <form class="field-row" id="torrent-form">
        <input type="search" id="torrent-q" placeholder="Title" aria-label="Title" autocomplete="off">
        <input type="number" id="torrent-ep" placeholder="Ep" aria-label="Episode number" min="1" inputmode="numeric">
        <select id="torrent-site" aria-label="Site">
          <option value="nyaa_si">Nyaa.si</option>
          <option value="sukebei">Sukebei</option>
          <option value="nyaa_land">Nyaa.land</option>
        </select>
        <button class="btn" type="submit">Search</button>
      </form>
      <div class="dest">
        <label for="torrent-dest">Save to</label>
        <select id="torrent-dest"></select>
        <span class="dest-path" id="torrent-dest-path"></span>
      </div>
      <div class="filters">
        <label><input type="checkbox" id="filter-hevc"> HEVC only</label>
        <label id="filter-fit-wrap" hidden><input type="checkbox" id="filter-fit" checked> Hide other episodes</label>
        <span class="grow"></span>
        <label class="sort">Sort
          <select id="torrent-sort">
            <option value="best">Best match</option>
            <option value="seeders">Seeders</option>
            <option value="newest">Newest</option>
            <option value="size">Size</option>
            <option value="name">Name</option>
          </select>
        </label>
      </div>
    </div>
    <div class="scroll" id="torrent-results"></div>
  </section>
</main>

<nav class="bottom-nav" aria-label="Sections">
  <button type="button" data-view="watchlist">Watchlist</button>
  <button type="button" data-view="calendar">Calendar</button>
  <button type="button" data-view="activity">Activity<span class="count" data-review-count hidden></span></button>
  <button type="button" data-view="search">Add</button>
  <button type="button" data-view="torrents">Torrents</button>
</nav>

<div id="toasts" aria-live="polite"></div>
<noscript><p class="empty">lydarr's interface needs JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
